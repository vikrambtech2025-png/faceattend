[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceattend"
version = "0.1.0"
description = "Privacy-first, real-time face-recognition attendance with liveness detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FaceAttend" }]
dependencies = [
  "insightface>=0.7.3",
  "onnxruntime>=1.18.0",
  "opencv-python>=4.10.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "structlog>=24.1.0",
  "httpx>=0.27.0",
  "mediapipe>=0.10.14",
  "alembic>=1.13.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
faceattend = "faceattend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faceattend = ["web/templates/*", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S", "RUF"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802", "N803"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = false
warn_return_any = true
check_untyped_defs = true
packages = ["faceattend"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=faceattend --cov-report=term-missing --cov-fail-under=40"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/faceattend"]
omit = ["*/web/*", "*/cli.py"]